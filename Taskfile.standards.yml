# cantica-tech standard tasks. A repository's own Taskfile includes this file (a checkout of the
# standards repository next to it, or STANDARDS_DIR) with `flatten: true`, so every repository has the
# same `task lint`, `task format`, `task typecheck`, `task standards:sync`, `task standards:check`.
# Tools run through uvx / npx at the versions pinned here — nothing to install but uv and Node.
version: "3"

vars:
  STANDARDS_DIR: '{{.STANDARDS_DIR | default "../standards"}}'
  RUFF: "uvx ruff@0.16.10"
  PYRIGHT: "uvx pyright@1.1.414"
  YAMLLINT: "uvx yamllint@1.38.0"
  MARKDOWNLINT: "npx --yes markdownlint-cli2@0.23.3"
  ACTIONLINT: "uvx --from actionlint-py@1.7.12.25 actionlint"
  ZIZMOR: "uvx zizmor@1.30.1"
  SHELLCHECK: "uvx --from shellcheck-py@0.11.0.1 shellcheck"

tasks:
  standards:sync:
    desc: "Copy the cantica-tech standards into this repository (.standards/, .editorconfig, ...)"
    cmds: ['python3 "{{.STANDARDS_DIR}}/scripts/sync.py" .']

  standards:check:
    desc: "Fail if this repository's copy of the standards drifted"
    cmds: ['python3 "{{.STANDARDS_DIR}}/scripts/sync.py" . --check']

  format:
    desc: "Format the code in place (Ruff; Prettier where package.json has it)"
    cmds:
      - '{{if .HAS_PY}}{{.RUFF}} format .{{end}}'
      - '{{if .HAS_PY}}{{.RUFF}} check --fix --select I .{{end}}'
      - '{{if .HAS_PRETTIER}}npx prettier --write .{{end}}'
    vars: &detect
      HAS_PY: {sh: 'git ls-files "*.py" | head -1'}
      HAS_MD: {sh: 'git ls-files "*.md" | head -1'}
      HAS_YAML: {sh: 'git ls-files "*.yml" "*.yaml" | head -1'}
      HAS_ACTIONS: {sh: 'git ls-files ".github/workflows/*" | head -1'}
      HAS_SH: {sh: 'git ls-files "*.sh" | head -1'}
      HAS_PRETTIER: {sh: 'test -f package.json && grep -q prettier package.json && echo yes || true'}

  lint:
    desc: "Every linter this repository's languages call for (the same set CI runs)"
    vars: *detect
    cmds:
      - '{{if .HAS_PY}}{{.RUFF}} format --check .{{end}}'
      - '{{if .HAS_PY}}{{.RUFF}} check .{{end}}'
      - '{{if .HAS_MD}}{{.MARKDOWNLINT}} "**/*.md"{{end}}'
      - '{{if .HAS_YAML}}{{.YAMLLINT}} --strict .{{end}}'
      - '{{if .HAS_ACTIONS}}{{.ACTIONLINT}}{{end}}'
      - '{{if .HAS_ACTIONS}}{{.ZIZMOR}} --min-severity medium .github/workflows{{end}}'
      - '{{if .HAS_SH}}git ls-files "*.sh" | xargs {{.SHELLCHECK}}{{end}}'

  typecheck:
    desc: "Pyright (Python); TypeScript type-checks through its own `npm run typecheck`"
    vars: *detect
    cmds:
      - '{{if .HAS_PY}}{{.PYRIGHT}}{{end}}'
