# cantica-tech reusable lint workflow. A repository calls it with:
#
#   jobs:
#     standards:
#       uses: cantica-tech/standards/.github/workflows/lint.yml@v0.1.0
#       with: { ref: v0.1.0 }
#
# It checks the repository's copy of the standards, then runs `task lint` and `task typecheck`
# exactly as a developer does locally.
name: standards

on:
  workflow_call:
    inputs:
      ref:
        description: "The standards version (the same tag as the `uses:` line)"
        type: string
        required: true
      typecheck:
        description: "Also run `task typecheck` (Pyright)"
        type: boolean
        default: true
      node:
        description: "Also run the repository's npm lint/format/typecheck scripts (TypeScript)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: cantica-tech/standards
          ref: ${{ inputs.ref }}
          path: .standards-src
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - uses: arduino/setup-task@c0bc642852239c2689f73f4ea6459c29405f3c52  # v3.0.0
        with:
          repo-token: ${{ github.token }}
      - name: Standards in sync
        run: python3 .standards-src/scripts/sync.py . --check
      - name: Lint
        run: task --taskfile .standards-src/Taskfile.standards.yml --dir . lint
      - name: Type check
        if: inputs.typecheck
        run: task --taskfile .standards-src/Taskfile.standards.yml --dir . typecheck
      - name: npm lint, format, typecheck
        if: inputs.node
        run: |
          npm ci
          npm run lint
          npm run format:check
          npm run typecheck
